<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 512" width="100%" height="100%">
  <defs>
    <!-- Hellerer, frischer grüner Hintergrund mit radialem Helligkeitsverlauf -->
    <radialGradient id="bgGradient" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#4CAF50" />
      <stop offset="60%" stop-color="#2E7D32" />
      <stop offset="100%" stop-color="#1B5E20" />
    </radialGradient>

    <!-- Glowing Effect für Schrift und Sterne -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Verlauf für den Sternenschweif -->
    <linearGradient id="trailGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fff9c4" stop-opacity="0.05" />
      <stop offset="50%" stop-color="#ffe082" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.6" />
    </linearGradient>

    <!-- Verlauf für den Stern & Text -->
    <linearGradient id="starGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fff59d" />
    </linearGradient>
  </defs>

  <!-- Abgerundetes Logo-Rechteck -->
  <rect width="1024" height="512" rx="100" fill="url(#bgGradient)" />

  <!-- Dezente Hintergrund-Funkeln -->
  <g fill="#ffffff" opacity="0.3">
    <circle cx="120" cy="80" r="2" />
    <circle cx="900" cy="430" r="1.5" />
    <circle cx="150" cy="440" r="2.5" />
    <circle cx="880" cy="60" r="2" />
    <circle cx="550" cy="90" r="1.5" />
  </g>

  <!-- Sternenschweif mit drei Streifen -->
  <g filter="url(#glow)">
    <!-- Streifen 1 (Untere Bahn) -->
    <path d="M 80,420 Q 380,450 700,270 T 950,135" fill="none" stroke="url(#trailGradient)" stroke-width="8" stroke-linecap="round" opacity="0.6" />
    
    <!-- Streifen 2 (Mittlere Bahn) -->
    <path d="M 60,395 Q 350,425 670,245 T 920,110" fill="none" stroke="url(#trailGradient)" stroke-width="14" stroke-linecap="round" opacity="0.8" />
    
    <!-- Streifen 3 (Obere Bahn) -->
    <path d="M 40,370 Q 320,400 640,220 T 890,85" fill="none" stroke="url(#trailGradient)" stroke-width="6" stroke-linecap="round" opacity="0.5" />

    <!-- Hauptstern an der Spitze des Schweifs -->
    <path d="M 930,110 Q 930,90 950,90 Q 930,90 930,70 Q 930,90 910,90 Q 930,90 930,110" fill="url(#starGradient)" />
    
    <!-- Kleiner Begleitstern -->
    <path d="M 780,165 Q 780,153 792,153 Q 780,153 780,141 Q 780,153 768,153 Q 780,153 780,165" fill="url(#starGradient)" />
  </g>

  <!-- Schriftzüge proportional skaliert und ca. 16px nach unten verschoben -->
  <g filter="url(#glow)" transform="translate(512, 306) rotate(-5) scale(1.15) translate(-512, -290)">
    <!-- Hauptschriftzug YAMEE -->
    <text x="512" y="275" font-family="&#39;Montserrat&#39;, &#39;Arial Black&#39;, sans-serif" font-weight="900" font-size="180" fill="url(#starGradient)" letter-spacing="14" text-anchor="middle">
      YAMEE
    </text>

    <!-- Untertitel -->
    <text x="512" y="335" font-family="&#39;Montserrat&#39;, &#39;Arial&#39;, sans-serif" font-weight="700" font-size="34.5" fill="#ffffff" opacity="0.9" letter-spacing="6.8" text-anchor="middle">
      Yet Another Map Editor Extra
    </text>
  </g>
</svg>