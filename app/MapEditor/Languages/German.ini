Both points lie in the same lake. = Beide Punkte liegen im selben See.
The water levels differ by {0} m (at most {1} m possible): the higher lake would have to be dug far too deep. = Die Wasserspiegel unterscheiden sich um {0} m (höchstens {1} m möglich): Der höhere See müsste viel zu tief gegraben werden.
