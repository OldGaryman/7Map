[River between lakes]
Connect lakes = Seen verbinden
Connect lakes: click into two lakes; YAMEE searches the course of a river between them and digs its valley. Both lakes get the same water level = Seen verbinden: in zwei Seen klicken; YAMEE sucht den Verlauf eines Flusses zwischen ihnen und gräbt sein Tal. Beide Seen bekommen denselben Wasserspiegel
Water width (m) = Wasserbreite (m)
Width of the water surface; it changes slowly along the river between the two values. Rivers of the game are 44 to 55 m wide = Breite der Wasserfläche; sie ändert sich entlang des Flusses langsam zwischen den beiden Werten. Flüsse des Spiels sind 44 bis 55 m breit
