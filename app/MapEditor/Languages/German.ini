The higher lake is dug {0} m deeper. = Der höhere See wird {0} m tiefer gegraben.
The valley cuts up to {0:0} m deep into the land. = Das Tal schneidet bis zu {0:0} m tief ins Land.
The valley cuts up to {0:0} m deep into the land. A lower course or a higher water level needs less digging. = Das Tal schneidet bis zu {0:0} m tief ins Land. Ein tieferer Verlauf oder ein höherer Wasserspiegel braucht weniger Aushub.
On about {0} m the land is lower than the bank: a low embankment is built there. = Auf etwa {0} m liegt das Land tiefer als das Ufer: Dort wird ein niedriger Damm gebaut.
River between lakes at {0:0}, {1:0} = Fluss zwischen Seen bei {0:0}, {1:0}
