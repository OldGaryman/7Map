Replace everything that the installed game does not have or that does not fit?\n\nCity tiles get a tile of the same district and shape with fitting road exits; their lots are built up again. Buildings and fillers get a fitting replacement, missing parts are removed. Then the project is saved and main.ttw and map_info.xml are written for the installed game version.\n\nUndo restores the saved backup. =Alles ersetzen, was es im installierten Spiel nicht gibt oder was nicht passt?\n\nStadt-Kacheln bekommen eine Kachel gleichen Viertels und gleicher Form mit passenden Straßenausgängen; ihre Bauplätze werden neu bebaut. Gebäude und Füller bekommen einen passenden Ersatz, fehlende Teile werden entfernt. Danach wird das Projekt gespeichert, und main.ttw und map_info.xml werden für die installierte Spielfassung geschrieben.\n\nRückgängig holt die gespeicherte Sicherung zurück.
