Only two markers are needed: the banking of the whole stretch is calculated from the curves of the road. In a curve the road tilts towards the inside (inside lower, outside higher), the tighter the curve the more; straights stay flat, at junctions the road is flat again. A banking typed in at a marker wins over the automatic one. = Es genügen zwei Markierungen: Die Querneigung der ganzen Strecke wird aus den Kurven der Straße berechnet. In einer Kurve kippt die Straße zur Innenseite (innen tiefer, außen höher), je enger die Kurve, desto stärker; Geraden bleiben eben, an Kreuzungen ist die Straße wieder eben. Eine von Hand an einer Markierung eingegebene Querneigung hat Vorrang.
