Change the course if you like: drag a point \= move it, click on the line \= add a point, right-click a point \= delete it. The first and the last point must stay in the lakes. Then Apply. Esc \= discard. = Verlauf bei Bedarf ändern: Punkt ziehen = verschieben, Klick auf die Linie = Punkt einfügen, Rechtsklick auf einen Punkt = löschen. Erster und letzter Punkt müssen in den Seen bleiben. Dann „Übernehmen“. Esc = verwerfen.
