Click onto an existing road: the marker snaps to the middle of the road. With two or more markers you can change the height, the grade and the banking (cross slope) of the road between them. = Klick auf eine vorhandene Straße: Die Markierung rastet genau auf der Straßenmitte ein. Ab zwei Markierungen lassen sich Höhe, Steigung und Querneigung der Straße dazwischen ändern.
