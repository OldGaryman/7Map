Click a marker, then type its new height, the grade of the road up to it or its banking. Drag a marker \= move, click onto the blue road \= insert a marker, right-click a marker \= delete. = Klicke eine Markierung an und tippe ihre neue Höhe, die Steigung der Straße bis dorthin oder ihre Querneigung ein. Markierung ziehen = verschieben, Klick auf die blaue Straße = Markierung einfügen, Rechtsklick auf eine Markierung = löschen.
