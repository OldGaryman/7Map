Slope from one side of the road to the other, like the banking of a race track. + \= the left side is higher (looking along the order of the markers), − \= the right side is higher. Between the markers it changes smoothly; at junctions the road is flat again. Enter \= apply. = Gefälle von einer Straßenseite zur anderen, wie die Steilkurve einer Rennstrecke. + = die linke Seite liegt höher (in Richtung der Markierungen gesehen), − = die rechte Seite liegt höher. Zwischen den Markierungen ändert sie sich fließend; an Kreuzungen ist die Straße wieder eben. Enter = übernehmen.
